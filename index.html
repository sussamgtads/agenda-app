<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Calendário &amp; Kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5fb;
    --bg-soft:#ffffff;
    --sidebar:#ffffff;
    --card:#ffffff;
    --border:#e6e7f0;
    --text:#1a1c28;
    --text-dim:#6b6f85;
    --text-faint:#9297ab;
    --accent:#6d5ef7;
    --accent2:#8b7bff;
    --accent-grad:linear-gradient(135deg,#6d5ef7 0%,#a56bff 100%);
    --accent-soft:#efedff;
    --today-ring:#6d5ef7;
    --success:#18b26b;
    --success-soft:#e5f9ee;
    --warn:#f5a524;
    --warn-soft:#fef3e0;
    --danger:#f24957;
    --danger-soft:#fde9ea;
    --shadow:0 4px 20px rgba(30,20,80,0.06);
    --shadow-lg:0 12px 40px rgba(30,20,80,0.12);
    --radius:16px;
    --radius-sm:10px;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0e0f16;
    --bg-soft:#151722;
    --sidebar:#12131d;
    --card:#181a26;
    --border:#262838;
    --text:#eef0f8;
    --text-dim:#9ba0b8;
    --text-faint:#6a6e85;
    --accent:#8a7bff;
    --accent2:#a892ff;
    --accent-grad:linear-gradient(135deg,#7c6bff 0%,#b083ff 100%);
    --accent-soft:#211f3b;
    --today-ring:#8a7bff;
    --success:#2fd888;
    --success-soft:#122a20;
    --warn:#ffb945;
    --warn-soft:#2e2413;
    --danger:#ff5f6c;
    --danger-soft:#2e161a;
    --shadow:0 4px 20px rgba(0,0,0,0.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e0f16; --bg-soft:#151722; --sidebar:#12131d; --card:#181a26;
      --border:#262838; --text:#eef0f8; --text-dim:#9ba0b8; --text-faint:#6a6e85;
      --accent:#8a7bff; --accent2:#a892ff; --accent-grad:linear-gradient(135deg,#7c6bff 0%,#b083ff 100%);
      --accent-soft:#211f3b; --today-ring:#8a7bff; --success:#2fd888; --success-soft:#122a20;
      --warn:#ffb945; --warn-soft:#2e2413; --danger:#ff5f6c; --danger-soft:#2e161a;
      --shadow:0 4px 20px rgba(0,0,0,0.35); --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex; height:100vh; width:100vw;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; flex-shrink:0; background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:22px 18px; display:flex; flex-direction:column; gap:22px;
    overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent-grad);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px;
    box-shadow:var(--shadow);
  }
  .brand-name{font-weight:800; font-size:16px; letter-spacing:-0.3px;}
  .brand-sub{font-size:11px; color:var(--text-faint); margin-top:-2px;}

  .btn-new{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent-grad); color:#fff; border:none; border-radius:12px;
    padding:12px 16px; font-weight:600; font-size:13.5px; cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(109,94,247,0.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-new:hover{transform:translateY(-1px); box-shadow:0 12px 24px -8px rgba(109,94,247,0.7);}
  .btn-new:active{transform:translateY(0);}

  .mini-cal{background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px;}
  .mini-cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 2px;}
  .mini-cal-title{font-size:12.5px; font-weight:700;}
  .mini-nav{display:flex; gap:2px;}
  .icon-btn{
    width:24px; height:24px; border:none; background:transparent; color:var(--text-dim);
    border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .icon-btn:hover{background:var(--accent-soft); color:var(--accent);}
  .mini-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .mini-dow{font-size:9.5px; color:var(--text-faint); font-weight:700; padding-bottom:4px;}
  .mini-day{
    font-size:11px; padding:5px 0; border-radius:7px; cursor:pointer; color:var(--text);
    transition:background .12s;
  }
  .mini-day:hover{background:var(--accent-soft);}
  .mini-day.muted{color:var(--text-faint);}
  .mini-day.today{color:var(--accent); font-weight:800;}
  .mini-day.selected{background:var(--accent-grad); color:#fff; font-weight:700;}
  .mini-day.has-event::after{content:''; display:block; width:3px; height:3px; border-radius:50%; background:var(--accent); margin:2px auto 0;}
  .mini-day.selected.has-event::after{background:#fff;}

  .side-section-title{font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; padding:0 4px;}
  .filters{display:flex; flex-direction:column; gap:6px;}
  .filter-item{display:flex; align-items:center; gap:9px; font-size:13px; padding:6px 4px; border-radius:8px; cursor:pointer; user-select:none;}
  .filter-item:hover{background:var(--bg);}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .dot.evento{background:#6d5ef7;} .dot.reuniao{background:#f5a524;} .dot.tarefa{background:#18b26b;}

  .upcoming-list{display:flex; flex-direction:column; gap:8px;}
  .upcoming-item{
    background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:9px 10px;
    cursor:pointer; transition:border-color .15s;
  }
  .upcoming-item:hover{border-color:var(--accent);}
  .upcoming-item .u-date{font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase;}
  .upcoming-item .u-title{font-size:12.5px; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .empty-hint{font-size:12px; color:var(--text-faint); padding:4px;}

  .sidebar-footer{margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px solid var(--border);}
  .theme-toggle{
    display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border);
    border-radius:999px; padding:4px; cursor:pointer; position:relative;
  }
  .theme-toggle button{
    border:none; background:transparent; width:30px; height:26px; border-radius:999px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text-faint); position:relative; z-index:1;
    transition:color .2s;
  }
  .theme-toggle button.active{color:#fff;}
  .theme-toggle .slider{
    position:absolute; top:4px; left:4px; width:30px; height:26px; border-radius:999px; background:var(--accent-grad);
    transition:transform .25s cubic-bezier(.4,0,.2,1); z-index:0;
  }
  .theme-toggle[data-mode="dark"] .slider{transform:translateX(30px);}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--border); gap:16px; flex-wrap:wrap;
  }
  .topbar-left{display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-width:0;}
  .topbar-left h1{font-size:20px; font-weight:800; letter-spacing:-0.4px;}
  .topbar-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0;}
  .nav-cluster{display:flex; align-items:center; gap:4px; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .nav-cluster button{border:none; background:transparent; width:30px; height:30px; border-radius:8px; cursor:pointer; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .nav-cluster button:hover{background:var(--accent-soft); color:var(--accent);}
  .btn-today{
    border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:12.5px; font-weight:600;
    padding:7px 13px; border-radius:9px; cursor:pointer;
  }
  .btn-today:hover{border-color:var(--accent); color:var(--accent);}

  .search-box{
    display:flex; align-items:center; gap:7px; background:var(--bg-soft); border:1px solid var(--border);
    border-radius:10px; padding:0 11px; height:36px; color:var(--text-faint); width:190px; max-width:100%;
    min-width:0; transition:width .2s, border-color .2s; flex-shrink:1;
  }
  .search-box:focus-within{border-color:var(--accent);}
  .search-box input{border:none; background:transparent; outline:none; font-size:12.5px; color:var(--text); width:100%; min-width:0; font-family:inherit;}
  .view-switch{display:flex; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;}
  .view-switch button{
    border:none; background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:600;
    padding:7px 14px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .view-switch button.active{background:var(--accent-grad); color:#fff; box-shadow:0 4px 12px -4px rgba(109,94,247,0.5);}

  .view{flex:1; overflow:auto; padding:20px 28px 28px;}

  /* Month grid */
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .dow-row{display:contents;}
  .dow-cell{background:var(--bg-soft); text-align:center; padding:10px 0; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
  .day-cell{
    background:var(--card); min-height:110px; padding:8px; display:flex; flex-direction:column; gap:5px;
    cursor:pointer; position:relative; transition:background .15s;
  }
  .day-cell:hover{background:var(--accent-soft);}
  .day-cell.other-month{background:var(--bg); }
  .day-cell.other-month .day-num{color:var(--text-faint);}
  .day-cell.selected{outline:2px solid var(--accent); outline-offset:-2px; background:var(--accent-soft);}
  .day-cell.drop-hover{outline:2px dashed var(--accent); outline-offset:-2px;}
  .day-num{
    font-size:12.5px; font-weight:700; color:var(--text); width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .day-cell.is-today .day-num{background:var(--accent-grad); color:#fff;}
  .day-events{display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .ev-chip{
    font-size:10.8px; padding:3px 6px; border-radius:6px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:4px; border-left:3px solid transparent;
  }
  .ev-chip.evento{background:var(--accent-soft); color:var(--accent); border-color:#6d5ef7;}
  .ev-chip.reuniao{background:var(--warn-soft); color:#c97e0e; border-color:var(--warn);}
  [data-theme="dark"] .ev-chip.reuniao{color:#ffb945;}
  .ev-chip.tarefa{background:var(--success-soft); color:#0e9358; border-color:var(--success);}
  [data-theme="dark"] .ev-chip.tarefa{color:#2fd888;}
  .ev-chip .repeat-ic{opacity:.7; flex-shrink:0;}
  .more-link{font-size:10.5px; color:var(--text-faint); font-weight:600; padding:2px 6px;}

  /* Hover preview card */
  .ev-preview{
    position:fixed; z-index:150; width:250px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow-lg); padding:13px 14px; opacity:0; transform:translateY(4px);
    pointer-events:none; transition:opacity .12s, transform .12s;
  }
  .ev-preview.show{opacity:1; transform:translateY(0);}
  .ev-preview-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .ev-preview-title{font-size:13.5px; font-weight:700; line-height:1.3;}
  .ev-preview-notes{font-size:11.5px; color:var(--text-dim); margin-bottom:8px; line-height:1.4;}
  .ev-preview-row{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); margin-top:4px;}
  .ev-preview-people{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
  .ev-preview-chip{background:var(--accent-soft); color:var(--accent); font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px;}

  /* Week view */
  .week-grid{display:grid; grid-template-columns:60px repeat(7,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--card);}
  .week-head{display:contents;}
  .week-head-cell{padding:10px 6px; text-align:center; border-bottom:1px solid var(--border); border-left:1px solid var(--border); background:var(--bg-soft);}
  .week-head-cell:first-child{border-left:none;}
  .week-head-dow{font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase;}
  .week-head-num{font-size:16px; font-weight:800; margin-top:2px;}
  .week-head-cell.is-today .week-head-num{color:var(--accent);}
  .week-body{display:grid; grid-template-columns:60px repeat(7,1fr); position:relative;}
  .hour-col{display:flex; flex-direction:column;}
  .hour-label{height:52px; font-size:10px; color:var(--text-faint); text-align:right; padding-right:8px; transform:translateY(-6px);}
  .week-day-col{border-left:1px solid var(--border); position:relative;}
  .hour-slot{height:52px; border-bottom:1px solid var(--border);}
  .week-event{
    position:absolute; left:3px; right:3px; border-radius:8px; padding:4px 7px; font-size:11px; font-weight:600;
    overflow:hidden; cursor:pointer; border-left:3px solid transparent;
  }

  /* Day list view (used inside kanban header) */
  .day-detail{display:flex; flex-direction:column; gap:10px;}

  /* Kanban */
  .kanban-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .kanban-date-title{font-size:15px; font-weight:700; color:var(--text-dim);}
  .kanban-board{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start;}
  .kanban-col{background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius); padding:14px; min-height:300px;}
  .kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .kanban-col-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .kanban-count{background:var(--card); border:1px solid var(--border); font-size:11px; font-weight:700; color:var(--text-dim); padding:1px 8px; border-radius:999px;}
  .kanban-add{border:none; background:transparent; color:var(--text-faint); cursor:pointer; width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .kanban-add:hover{background:var(--accent-soft); color:var(--accent);}
  .kanban-list{display:flex; flex-direction:column; gap:9px; min-height:40px;}
  .kanban-list.drop-hover{outline:2px dashed var(--accent); outline-offset:4px; border-radius:10px;}
  .kcard{
    background:var(--card); border:1px solid var(--border); border-radius:11px; padding:11px 12px; cursor:grab;
    box-shadow:var(--shadow); transition:transform .12s ease, box-shadow .12s ease;
  }
  .kcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .kcard:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;}
  .kcard-top{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .kcard-type{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:999px;}
  .kcard-type.evento{background:var(--accent-soft); color:var(--accent);}
  .kcard-type.reuniao{background:var(--warn-soft); color:#c97e0e;}
  [data-theme="dark"] .kcard-type.reuniao{color:#ffb945;}
  .kcard-type.tarefa{background:var(--success-soft); color:#0e9358;}
  [data-theme="dark"] .kcard-type.tarefa{color:#2fd888;}
  .kcard-time{font-size:10.5px; color:var(--text-faint); font-weight:600; margin-left:auto;}
  .kcard-title{font-size:13px; font-weight:700; margin-bottom:4px; line-height:1.3;}
  .kcard-people{display:flex; align-items:center; gap:5px; margin-top:6px;}
  .avatar-stack{display:flex;}
  .avatar{
    width:20px; height:20px; border-radius:50%; background:var(--accent-grad); color:#fff; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--card); margin-left:-6px;
  }
  .avatar:first-child{margin-left:0;}
  .kcard-people-count{font-size:10.5px; color:var(--text-faint); font-weight:600;}
  .kanban-empty{font-size:12px; color:var(--text-faint); text-align:center; padding:18px 4px; border:1.5px dashed var(--border); border-radius:10px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,8,25,0.5); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--card); width:480px; max-width:92vw; max-height:88vh; overflow-y:auto; border-radius:20px;
    box-shadow:var(--shadow-lg); transform:scale(.96) translateY(8px); transition:transform .18s;
    border:1px solid var(--border);
  }
  .overlay.open .modal{transform:scale(1) translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px;}
  .modal-head h2{font-size:16px; font-weight:800;}
  .modal-close{border:none; background:var(--bg-soft); width:30px; height:30px; border-radius:9px; cursor:pointer; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .modal-close:hover{background:var(--danger-soft); color:var(--danger);}
  .modal-body{padding:14px 20px 20px; display:flex; flex-direction:column; gap:14px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field select, .field textarea{
    background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13.5px;
    color:var(--text); font-family:inherit; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:56px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .type-picker{display:flex; gap:8px;}
  .type-opt{
    flex:1; border:1.5px solid var(--border); background:var(--bg-soft); border-radius:10px; padding:9px 6px;
    text-align:center; font-size:12px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-dim);
  }
  .type-opt .dot{width:8px; height:8px;}
  .type-opt.active{border-color:var(--accent); color:var(--text); background:var(--accent-soft);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{position:relative; width:40px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .2s;}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .track{background:var(--accent-grad);}
  .switch input:checked + .track .knob{transform:translateX(18px);}
  .people-input{display:flex; flex-wrap:wrap; gap:6px; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:8px; align-items:center;}
  .person-tag{
    display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600;
    padding:4px 8px 4px 4px; border-radius:999px;
  }
  .person-tag .p-av{width:18px; height:18px; border-radius:50%; background:var(--accent-grad); color:#fff; font-size:8.5px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .person-tag button{border:none; background:transparent; color:inherit; cursor:pointer; opacity:.7; display:flex;}
  .person-tag button:hover{opacity:1;}
  .people-input input{border:none; background:transparent; outline:none; font-size:13px; flex:1; min-width:100px; color:var(--text); padding:4px;}
  .modal-foot{display:flex; align-items:center; justify-content:space-between; padding:14px 20px 20px; gap:10px;}
  .btn{border:none; border-radius:10px; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent-grad); color:#fff; box-shadow:0 8px 18px -8px rgba(109,94,247,0.6);}
  .btn-ghost{background:var(--bg-soft); color:var(--text-dim); border:1px solid var(--border);}
  .btn-danger-text{background:transparent; color:var(--danger); border:none; font-size:12.5px; font-weight:700; cursor:pointer;}
  .btn-danger-text:hover{text-decoration:underline;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:200;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  [data-theme="dark"] .toast{background:#eef0f8; color:#0e0f16;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width: 880px){
    .sidebar{display:none;}
    .kanban-board{grid-template-columns:1fr;}
    .topbar{padding:14px 16px;}
    .view{padding:14px 16px 20px;}
  }
  @media (max-width: 560px){
    .topbar{flex-direction:column; align-items:stretch;}
    .topbar-left, .topbar-right{width:100%;}
    .topbar-left h1{font-size:16px; order:3; width:100%;}
    .search-box{width:auto; flex:1 1 120px;}
    .view-switch{flex:1 1 auto;}
    .view-switch button{padding:7px 8px; font-size:11.5px; flex:1;}
    .month-grid{border-radius:12px;}
    .day-cell{min-height:78px; padding:6px;}
    .modal{width:100%; max-width:100%; border-radius:20px 20px 0 0; position:fixed; bottom:0; margin:0;}
    .overlay{align-items:flex-end;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-name">Agenda</div>
        <div class="brand-sub">Sua semana, organizada</div>

    </div>

    <button class="btn-new" id="btnNewEvent">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      Novo compromisso
    </button>

    <div class="mini-cal">
      <div class="mini-cal-head">
        <div class="mini-cal-title" id="miniCalTitle">—</div>
        <div class="mini-nav">
          <button class="icon-btn" id="miniPrev">‹</button>
          <button class="icon-btn" id="miniNext">›</button>
        </div>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>

    <div>
      <div class="side-section-title" style="margin-bottom:8px;">Categorias</div>
      <div class="filters">
        <label class="filter-item"><input type="checkbox" class="cat-filter" data-cat="evento" checked style="display:none;"><span class="dot evento"></span> Eventos</label>
        <label class="filter-item"><input type="checkbox" class="cat-filter" data-cat="reuniao" checked style="display:none;"><span class="dot reuniao"></span> Reuniões</label>
        <label class="filter-item"><input type="checkbox" class="cat-filter" data-cat="tarefa" checked style="display:none;"><span class="dot tarefa"></span> Tarefas</label>
      </div>
    </div>

    <div style="flex:1; min-height:0; display:flex; flex-direction:column; gap:8px;">
      <div class="side-section-title">Próximos</div>
      <div class="upcoming-list" id="upcomingList"></div>
    </div>

    <div class="sidebar-footer">
      <span style="font-size:11px; color:var(--text-faint);">Tema</span>
      <div class="theme-toggle" id="themeToggle" data-mode="light">
        <div class="slider"></div>
        <button data-mode="light" class="active" title="Claro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button data-mode="dark" title="Escuro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="nav-cluster">
          <button id="navPrev">‹</button>
          <button id="navNext">›</button>
        </div>
        <button class="btn-today" id="btnTodayTop">Hoje</button>
        <h1 id="periodTitle">—</h1>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar compromissos...">
        </div>
        <div class="view-switch">
          <button class="active" data-view="month">Mês</button>
          <button data-view="week">Semana</button>
          <button data-view="kanban">Kanban do dia</button>
        </div>
      </div>
    </div>

    <div class="view" id="viewMonth">
      <div class="month-grid" id="monthGrid"></div>
    </div>

    <div class="view" id="viewWeek" style="display:none;">
      <div class="week-grid" id="weekHead"></div>
      <div style="max-height:calc(100vh - 220px); overflow-y:auto; border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius); background:var(--card);">

    <div class="view" id="viewKanban" style="display:none;">

          <div class="kanban-date-title" id="kanbanDateTitle">—</div>

        <div class="nav-cluster">
          <button id="kanbanPrevDay">‹</button>
          <button class="btn-today" id="kanbanToday" style="border:none; background:transparent;">Hoje</button>
          <button id="kanbanNextDay">›</button>
        </div>
      </div>
      <div class="kanban-board" id="kanbanBoard"></div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Novo compromisso</h2>
      <button class="modal-close" id="modalClose">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Título</label>
        <input type="text" id="fTitle" placeholder="Ex: Reunião com o time de obra">
      </div>

      <div class="field">
        <label>Tipo</label>
        <div class="type-picker" id="typePicker">
          <div class="type-opt active" data-type="evento"><span class="dot evento"></span>Evento</div>
          <div class="type-opt" data-type="reuniao"><span class="dot reuniao"></span>Reunião</div>
          <div class="type-opt" data-type="tarefa"><span class="dot tarefa"></span>Tarefa</div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>Data</label>
          <input type="date" id="fDate">
        </div>
        <div class="field">
          <label>Status inicial</label>
          <select id="fStatus">
            <option value="todo">A fazer</option>
            <option value="doing">Em andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
      </div>

      <div class="toggle-row">
        <label style="font-size:13px; font-weight:600;">Dia inteiro</label>
        <label class="switch"><input type="checkbox" id="fAllDay"><span class="track"><span class="knob"></span></span></label>
      </div>

      <div class="row2" id="timeRow">
        <div class="field">
          <label>Início</label>
          <input type="time" id="fStart" value="09:00">
        </div>
        <div class="field">
          <label>Fim</label>
          <input type="time" id="fEnd" value="10:00">
        </div>
      </div>

      <div class="field">
        <label>Repetir</label>
        <select id="fRepeat">
          <option value="none">Não repete</option>
          <option value="daily">Todos os dias</option>

          <option value="monthly">Todo mês</option>
          <option value="yearly">Todo ano</option>
        </select>

      <div class="field">
        <label>Convidados / participantes</label>
        <div class="people-input" id="peopleInput">
          <input type="text" id="fPersonField" placeholder="Digite um nome e pressione Enter">

      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger-text" id="btnDelete" style="visibility:hidden;">Excluir compromisso</button>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
        <button class="btn btn-primary" id="btnSave">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ev-preview" id="evPreview"></div>

<script>
(function(){
  "use strict";

  /* ---------------- State & storage ---------------- */
  const LS_EVENTS = "agenda_events_v1";
  const LS_STATUS = "agenda_status_v1";
  const LS_THEME = "agenda_theme_v1";

  let events = JSON.parse(localStorage.getItem(LS_EVENTS) || "[]");
  let occStatus = JSON.parse(localStorage.getItem(LS_STATUS) || "{}"); // key: eventId__YYYY-MM-DD -> status
  let activeFilters = new Set(["evento","reuniao","tarefa"]);
  let searchQuery = "";

  function matchesSearch(ev){
    if(!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return ev.title.toLowerCase().includes(q)
      || (ev.notes||'').toLowerCase().includes(q)
      || (ev.people||[]).some(p=>p.toLowerCase().includes(q));
  }

  function saveEvents(){ localStorage.setItem(LS_EVENTS, JSON.stringify(events)); }
  function saveStatus(){ localStorage.setItem(LS_STATUS, JSON.stringify(occStatus)); }

  function uid(){ return 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  /* ---------------- Date helpers ---------------- */
  const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function fmt(d){ // YYYY-MM-DD local
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function parseYMD(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function sameDay(a,b){ return fmt(a)===fmt(b); }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ const r=new Date(d); r.setDate(r.getDate()-r.getDay()); r.setHours(0,0,0,0); return r; }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

  const todayDate = new Date(); todayDate.setHours(0,0,0,0);

  let cursor = new Date(); // month/week reference
  let selectedDate = new Date(todayDate); // for month view selection + kanban day
  let kanbanDate = new Date(todayDate);
  let miniCursor = new Date();
  let currentView = 'month';

  /* ---------------- Recurrence expansion ---------------- */
  // Returns list of {event, date} occurrences intersecting [rangeStart, rangeEnd] inclusive
  function occurrencesInRange(rangeStart, rangeEnd){
    const out = [];
    for(const ev of events){
      const base = parseYMD(ev.date);
      if(ev.repeat === 'none'){
        if(base >= rangeStart && base <= rangeEnd) out.push({event:ev, date:new Date(base)});
        continue;
      }
      let cur = new Date(base);
      let guard = 0;
      while(cur <= rangeEnd && guard < 1000){
        guard++;
        if(cur >= rangeStart) out.push({event:ev, date:new Date(cur)});
        if(ev.repeat === 'daily') cur = addDays(cur,1);
        else if(ev.repeat === 'weekly') cur = addDays(cur,7);
        else if(ev.repeat === 'monthly'){ const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n; }
        else if(ev.repeat === 'yearly'){ const n = new Date(cur); n.setFullYear(n.getFullYear()+1); cur = n; }
        else break;
      }
    }
    out.sort((a,b)=> (a.date - b.date) || (a.event.allDay ? -1 : (a.event.start||'').localeCompare(b.event.start||'')));
    return out;
  }

  function occurrencesOnDay(d){
    const s = new Date(d); s.setHours(0,0,0,0);
    const e = new Date(d); e.setHours(0,0,0,0);
    return occurrencesInRange(s,e).filter(o => activeFilters.has(o.event.type) && matchesSearch(o.event));
  }

  function statusKey(ev, date){ return ev.id + '__' + fmt(date); }
  function getStatus(ev, date){ return occStatus[statusKey(ev,date)] || ev.defaultStatus || 'todo'; }
  function setStatus(ev, date, status){ occStatus[statusKey(ev,date)] = status; saveStatus(); }

  /* ---------------- Theme ---------------- */
  function applyTheme(mode){
    if(mode === 'system'){ document.documentElement.removeAttribute('data-theme'); }
    else document.documentElement.setAttribute('data-theme', mode);
    document.getElementById('themeToggle').dataset.mode = mode === 'dark' ? 'dark' : 'light';
    document.querySelectorAll('.theme-toggle button').forEach(b=> b.classList.toggle('active', b.dataset.mode === (mode==='dark'?'dark':'light')));
    localStorage.setItem(LS_THEME, mode);
  }
  const savedTheme = localStorage.getItem(LS_THEME) || 'light';
  applyTheme(savedTheme);
  document.querySelectorAll('.theme-toggle button').forEach(b=>{
    b.addEventListener('click', ()=> applyTheme(b.dataset.mode));
  });

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  /* ---------------- Mini calendar ---------------- */
  function renderMiniCal(){
    const grid = document.getElementById('miniGrid');
    document.getElementById('miniCalTitle').textContent = `${MONTHS[miniCursor.getMonth()]} ${miniCursor.getFullYear()}`;
    grid.innerHTML = '';
    DOW.forEach(d=>{
      const el = document.createElement('div'); el.className='mini-dow'; el.textContent = d[0];
      grid.appendChild(el);
    });
    const first = startOfMonth(miniCursor);
    const startGrid = startOfWeek(first);
    const monthEvents = occurrencesInRange(startGrid, addDays(startGrid, 41));
    const eventDays = new Set(monthEvents.map(o=>fmt(o.date)));
    for(let i=0;i<42;i++){
      const d = addDays(startGrid, i);
      const el = document.createElement('div');
      el.className = 'mini-day';
      if(d.getMonth() !== miniCursor.getMonth()) el.classList.add('muted');
      if(sameDay(d, todayDate)) el.classList.add('today');
      if(sameDay(d, selectedDate)) el.classList.add('selected');
      if(eventDays.has(fmt(d))) el.classList.add('has-event');
      el.textContent = d.getDate();
      el.addEventListener('click', ()=>{
        selectedDate = new Date(d);
        cursor = new Date(d);
        kanbanDate = new Date(d);
        renderAll();
      });
      grid.appendChild(el);
    }
  }
  document.getElementById('miniPrev').addEventListener('click', ()=>{ miniCursor.setMonth(miniCursor.getMonth()-1); renderMiniCal(); });
  document.getElementById('miniNext').addEventListener('click', ()=>{ miniCursor.setMonth(miniCursor.getMonth()+1); renderMiniCal(); });

  /* ---------------- Upcoming list ---------------- */
  function renderUpcoming(){
    const list = document.getElementById('upcomingList');
    const occ = occurrencesInRange(todayDate, addDays(todayDate, 60)).filter(o=>activeFilters.has(o.event.type) && matchesSearch(o.event)).slice(0,8);
    list.innerHTML = '';
    if(!occ.length){
      list.innerHTML = '<div class="empty-hint">Nada por aqui ainda. Crie seu primeiro compromisso.</div>';
      return;
    }
    occ.forEach(o=>{
      const el = document.createElement('div');
      el.className = 'upcoming-item';
      const dLabel = sameDay(o.date, todayDate) ? 'Hoje' : `${o.date.getDate()} ${MONTHS[o.date.getMonth()].slice(0,3)}`;
      el.innerHTML = `<div class="u-date">${dLabel}${o.event.allDay ? '' : ' · ' + (o.event.start||'')}</div><div class="u-title">${escapeHtml(o.event.title)}</div>`;
      el.addEventListener('click', ()=> openEditModal(o.event, o.date));
      list.appendChild(el);
    });
  }

  /* ---------------- Filters ---------------- */
  document.querySelectorAll('.filter-item').forEach(item=>{
    item.addEventListener('click', (e)=>{
      const cb = item.querySelector('.cat-filter');
      cb.checked = !cb.checked;
      item.style.opacity = cb.checked ? '1' : '.45';
      const cat = cb.dataset.cat;
      if(cb.checked) activeFilters.add(cat); else activeFilters.delete(cat);
      renderAll();
    });
  });

  /* ---------------- Search ---------------- */
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchQuery = e.target.value.trim();
    renderAll();
  });

  /* ---------------- Hover preview ---------------- */
  const previewEl = document.getElementById('evPreview');
  let previewTimer;
  function showPreview(target, ev, date){
    clearTimeout(previewTimer);
    const people = ev.people || [];
    const dLabel = `${DOW[date.getDay()]}, ${date.getDate()} ${MONTHS[date.getMonth()].slice(0,3)}`;
    previewEl.innerHTML = `
      <div class="ev-preview-top">
        <div class="ev-preview-title">${escapeHtml(ev.title)}</div>
        <span class="dot ${ev.type}" style="margin-top:4px;"></span>
      </div>
      ${ev.notes ? `<div class="ev-preview-notes">${escapeHtml(ev.notes)}</div>` : ''}
      <div class="ev-preview-row">📅 ${dLabel}${ev.allDay ? ' · Dia todo' : ' · ' + (ev.start||'') + (ev.end ? '–'+ev.end : '')}</div>
      ${ev.repeat && ev.repeat!=='none' ? `<div class="ev-preview-row">↻ Repete ${ {daily:'todos os dias',weekly:'toda semana',monthly:'todo mês',yearly:'todo ano'}[ev.repeat] }</div>` : ''}
      ${people.length ? `<div class="ev-preview-people">${people.map(p=>`<span class="ev-preview-chip">${escapeHtml(p)}</span>`).join('')}</div>` : ''}
    `;
    const r = target.getBoundingClientRect();
    let left = r.left;
    let top = r.bottom + 8;
    const maxLeft = window.innerWidth - 266;
    if(left > maxLeft) left = maxLeft;
    if(top + 160 > window.innerHeight) top = r.top - 8 - 160;
    previewEl.style.left = left + 'px';
    previewEl.style.top = top + 'px';
    previewEl.classList.add('show');
  }
  function hidePreview(){
    previewTimer = setTimeout(()=> previewEl.classList.remove('show'), 60);
  }

  /* ---------------- View switching ---------------- */
  document.querySelectorAll('.view-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.view-switch button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      document.getElementById('viewMonth').style.display = currentView==='month' ? 'block' : 'none';
      document.getElementById('viewWeek').style.display = currentView==='week' ? 'block' : 'none';
      document.getElementById('viewKanban').style.display = currentView==='kanban' ? 'block' : 'none';
      renderAll();
    });
  });

  document.getElementById('navPrev').addEventListener('click', ()=>{
    if(currentView==='month'){ cursor.setMonth(cursor.getMonth()-1); }
    else if(currentView==='week'){ cursor = addDays(cursor,-7); }
    renderAll();
  });
  document.getElementById('navNext').addEventListener('click', ()=>{
    if(currentView==='month'){ cursor.setMonth(cursor.getMonth()+1); }
    else if(currentView==='week'){ cursor = addDays(cursor,7); }
    renderAll();
  });
  document.getElementById('btnTodayTop').addEventListener('click', ()=>{
    cursor = new Date(todayDate); selectedDate = new Date(todayDate); kanbanDate = new Date(todayDate); miniCursor = new Date(todayDate);
    renderAll();
  });

  /* ---------------- Month view ---------------- */
  function renderMonth(){
    document.getElementById('periodTitle').textContent = `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;
    const grid = document.getElementById('monthGrid');
    grid.innerHTML = '';
    DOW.forEach(d=>{
      const el = document.createElement('div'); el.className='dow-cell'; el.textContent=d;
      grid.appendChild(el);
    });
    const first = startOfMonth(cursor);
    const startGrid = startOfWeek(first);
    const rangeEnd = addDays(startGrid, 41);
    const occ = occurrencesInRange(startGrid, rangeEnd).filter(o=>activeFilters.has(o.event.type) && matchesSearch(o.event));
    const byDay = {};
    occ.forEach(o=>{ const k=fmt(o.date); (byDay[k]=byDay[k]||[]).push(o); });

    for(let i=0;i<42;i++){
      const d = addDays(startGrid,i);
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if(d.getMonth() !== cursor.getMonth()) cell.classList.add('other-month');
      if(sameDay(d, todayDate)) cell.classList.add('is-today');
      if(sameDay(d, selectedDate)) cell.classList.add('selected');
      cell.dataset.date = fmt(d);

      const num = document.createElement('div'); num.className='day-num'; num.textContent = d.getDate();
      cell.appendChild(num);

      const evWrap = document.createElement('div'); evWrap.className='day-events';
      const dayOcc = (byDay[fmt(d)]||[]);
      dayOcc.slice(0,3).forEach(o=>{
        const chip = document.createElement('div');
        chip.className = `ev-chip ${o.event.type}`;
        chip.innerHTML = `${o.event.repeat!=='none' ? '<span class="repeat-ic">↻</span>' : ''}${o.event.allDay?'':'<span>'+ (o.event.start||'') +'</span> · '}${escapeHtml(o.event.title)}`;
        chip.addEventListener('click', (e)=>{ e.stopPropagation(); openEditModal(o.event, o.date); });
        chip.addEventListener('mouseenter', ()=> showPreview(chip, o.event, o.date));
        chip.addEventListener('mouseleave', hidePreview);
        evWrap.appendChild(chip);
      });
      if(dayOcc.length>3){
        const more = document.createElement('div'); more.className='more-link'; more.textContent = `+${dayOcc.length-3} mais`;
        evWrap.appendChild(more);
      }
      cell.appendChild(evWrap);

      cell.addEventListener('click', ()=>{
        selectedDate = new Date(d); miniCursor = new Date(d);
        renderMiniCal();
        document.querySelectorAll('.day-cell').forEach(c=>c.classList.remove('selected'));
        cell.classList.add('selected');
      });
      cell.addEventListener('dblclick', ()=> openNewModal(d));

      // drag & drop to move an event's date
      cell.addEventListener('dragover', (e)=>{ e.preventDefault(); cell.classList.add('drop-hover'); });
      cell.addEventListener('dragleave', ()=> cell.classList.remove('drop-hover'));
      cell.addEventListener('drop', (e)=>{
        e.preventDefault(); cell.classList.remove('drop-hover');
        const evId = e.dataTransfer.getData('text/event-id');
        const ev = events.find(x=>x.id===evId);
        if(ev){ ev.date = fmt(d); saveEvents(); renderAll(); toast('Compromisso movido'); }
      });

      grid.appendChild(cell);
    }
    // make chips draggable
    grid.querySelectorAll('.ev-chip').forEach((chip)=>{});
  }

  /* ---------------- Week view ---------------- */
  function renderWeek(){
    const start = startOfWeek(cursor);
    document.getElementById('periodTitle').textContent = `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${addDays(start,6).getDate()} ${MONTHS[addDays(start,6).getMonth()].slice(0,3)}`;
    const head = document.getElementById('weekHead');
    head.innerHTML = '<div class="week-head-cell" style="background:transparent; border:none;"></div>';
    for(let i=0;i<7;i++){
      const d = addDays(start,i);
      const c = document.createElement('div'); c.className='week-head-cell' + (sameDay(d,todayDate)?' is-today':'');
      c.innerHTML = `<div class="week-head-dow">${DOW[d.getDay()]}</div><div class="week-head-num">${d.getDate()}</div>`;
      head.appendChild(c);
    }
    const body = document.getElementById('weekBody');
    body.innerHTML = '';
    const hourCol = document.createElement('div'); hourCol.className='hour-col';
    for(let h=0;h<24;h++){ const lab=document.createElement('div'); lab.className='hour-label'; lab.textContent = (h===0?'':`${String(h).padStart(2,'0')}:00`); hourCol.appendChild(lab); }
    body.appendChild(hourCol);

    const occ = occurrencesInRange(start, addDays(start,6)).filter(o=>activeFilters.has(o.event.type) && matchesSearch(o.event));
    const byDay = {};
    occ.forEach(o=>{ const k=fmt(o.date); (byDay[k]=byDay[k]||[]).push(o); });

    for(let i=0;i<7;i++){
      const d = addDays(start,i);
      const col = document.createElement('div'); col.className='week-day-col'; col.style.position='relative';
      for(let h=0;h<24;h++){ const slot=document.createElement('div'); slot.className='hour-slot'; slot.addEventListener('dblclick', ()=>{ const nd=new Date(d); openNewModal(nd, `${String(h).padStart(2,'0')}:00`); }); col.appendChild(slot); }
      (byDay[fmt(d)]||[]).forEach(o=>{
        if(o.event.allDay) return;
        const [sh,sm] = (o.event.start||'09:00').split(':').map(Number);
        const [eh,em] = (o.event.end||'10:00').split(':').map(Number);
        const top = (sh + sm/60) * 52;
        let height = ((eh + em/60) - (sh+sm/60)) * 52;
        if(height < 22) height = 22;
        const chip = document.createElement('div');
        chip.className = `week-event ${o.event.type}`;
        chip.style.top = top+'px'; chip.style.height = height+'px';
        const bg = o.event.type==='evento' ? 'var(--accent-soft)' : o.event.type==='reuniao' ? 'var(--warn-soft)' : 'var(--success-soft)';
        const bl = o.event.type==='evento' ? '#6d5ef7' : o.event.type==='reuniao' ? 'var(--warn)' : 'var(--success)';
        const col_ = o.event.type==='evento' ? 'var(--accent)' : o.event.type==='reuniao' ? '#c97e0e' : '#0e9358';
        chip.style.background = bg; chip.style.borderLeftColor = bl; chip.style.color = col_;
        chip.innerHTML = `<div style="font-weight:700;">${escapeHtml(o.event.title)}</div><div style="opacity:.75; font-size:9.5px;">${o.event.start||''}</div>`;
        chip.addEventListener('click', ()=> openEditModal(o.event, o.date));
        col.appendChild(chip);
      });
      body.appendChild(col);
    }
  }

  /* ---------------- Kanban view ---------------- */
  const COLS = [
    {key:'todo', label:'A fazer', icon:'○'},
    {key:'doing', label:'Em andamento', icon:'◐'},
    {key:'done', label:'Concluído', icon:'●'}
  ];

  function initials(name){
    return name.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');
  }

  function renderKanban(){
    document.getElementById('kanbanDateTitle').textContent =
      `${DOW[kanbanDate.getDay()]}, ${kanbanDate.getDate()} de ${MONTHS[kanbanDate.getMonth()]} de ${kanbanDate.getFullYear()}` + (sameDay(kanbanDate, todayDate) ? '  •  Hoje' : '');
    document.getElementById('periodTitle').textContent = 'Kanban do dia';
    const board = document.getElementById('kanbanBoard');
    board.innerHTML = '';
    const dayOcc = occurrencesOnDay(kanbanDate);

    COLS.forEach(col=>{
      const items = dayOcc.filter(o => getStatus(o.event, o.date) === col.key);
      const colEl = document.createElement('div');
      colEl.className = 'kanban-col';
      colEl.innerHTML = `
        <div class="kanban-col-head">
          <div class="kanban-col-title">${col.icon} ${col.label} <span class="kanban-count">${items.length}</span></div>
          <button class="kanban-add" title="Adicionar tarefa">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="kanban-list" data-col="${col.key}"></div>
      `;
      colEl.querySelector('.kanban-add').addEventListener('click', ()=> openNewModal(kanbanDate, null, col.key));
      const listEl = colEl.querySelector('.kanban-list');

      if(!items.length){
        const empty = document.createElement('div'); empty.className='kanban-empty'; empty.textContent = 'Arraste um card aqui';
        listEl.appendChild(empty);
      }
      items.forEach(o=>{
        const card = document.createElement('div');
        card.className = 'kcard';
        card.draggable = true;
        card.dataset.eventId = o.event.id;
        card.dataset.date = fmt(o.date);
        const people = o.event.people || [];
        card.innerHTML = `
          <div class="kcard-top">
            <span class="kcard-type ${o.event.type}">${o.event.type}</span>
            <span class="kcard-time">${o.event.allDay ? 'Dia todo' : (o.event.start||'')}</span>
          </div>
          <div class="kcard-title">${escapeHtml(o.event.title)}</div>
          ${people.length ? `<div class="kcard-people"><div class="avatar-stack">${people.slice(0,4).map(p=>`<div class="avatar" title="${escapeHtml(p)}">${initials(p)}</div>`).join('')}</div>${people.length>4?`<span class="kcard-people-count">+${people.length-4}</span>`:''}</div>` : ''}
        `;
        card.addEventListener('click', ()=> openEditModal(o.event, o.date));
        card.addEventListener('dragstart', (e)=>{
          card.classList.add('dragging');
          e.dataTransfer.setData('text/event-id', o.event.id);
          e.dataTransfer.setData('text/occ-date', fmt(o.date));
          e.dataTransfer.setData('text/kanban', '1');
        });
        card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
        listEl.appendChild(card);
      });

      listEl.addEventListener('dragover', (e)=>{ e.preventDefault(); listEl.classList.add('drop-hover'); });
      listEl.addEventListener('dragleave', ()=> listEl.classList.remove('drop-hover'));
      listEl.addEventListener('drop', (e)=>{
        e.preventDefault(); listEl.classList.remove('drop-hover');
        const evId = e.dataTransfer.getData('text/event-id');
        const occDate = e.dataTransfer.getData('text/occ-date');
        const ev = events.find(x=>x.id===evId);
        if(ev && occDate){
          setStatus(ev, parseYMD(occDate), col.key);
          renderKanban();
          toast('Status atualizado');
        }
      });

      board.appendChild(colEl);
    });
  }

  document.getElementById('kanbanPrevDay').addEventListener('click', ()=>{ kanbanDate = addDays(kanbanDate,-1); renderKanban(); });
  document.getElementById('kanbanNextDay').addEventListener('click', ()=>{ kanbanDate = addDays(kanbanDate,1); renderKanban(); });
  document.getElementById('kanbanToday').addEventListener('click', ()=>{ kanbanDate = new Date(todayDate); renderKanban(); });

  /* ---------------- Modal (create / edit) ---------------- */
  const overlay = document.getElementById('overlay');
  let editingEvent = null;
  let editingOccDate = null;
  let peopleTags = [];

  function openNewModal(date, time, status){
    editingEvent = null; editingOccDate = null;
    document.getElementById('modalTitle').textContent = 'Novo compromisso';
    document.getElementById('btnDelete').style.visibility = 'hidden';
    document.getElementById('fTitle').value = '';
    document.getElementById('fDate').value = fmt(date || selectedDate);
    document.getElementById('fAllDay').checked = false;
    document.getElementById('timeRow').style.display = 'grid';
    document.getElementById('fStart').value = time || '09:00';
    document.getElementById('fEnd').value = time ? addHour(time) : '10:00';
    document.getElementById('fRepeat').value = 'none';
    document.getElementById('fNotes').value = '';
    document.getElementById('fStatus').value = status || 'todo';
    setType('evento');
    peopleTags = [];
    renderPeopleTags();
    overlay.classList.add('open');
    setTimeout(()=>document.getElementById('fTitle').focus(), 80);
  }

  function openEditModal(ev, occDate){
    editingEvent = ev; editingOccDate = occDate;
    document.getElementById('modalTitle').textContent = 'Editar compromisso';
    document.getElementById('btnDelete').style.visibility = 'visible';
    document.getElementById('fTitle').value = ev.title;
    document.getElementById('fDate').value = ev.date;
    document.getElementById('fAllDay').checked = !!ev.allDay;
    document.getElementById('timeRow').style.display = ev.allDay ? 'none' : 'grid';
    document.getElementById('fStart').value = ev.start || '09:00';
    document.getElementById('fEnd').value = ev.end || '10:00';
    document.getElementById('fRepeat').value = ev.repeat || 'none';
    document.getElementById('fNotes').value = ev.notes || '';
    document.getElementById('fStatus').value = getStatus(ev, occDate || parseYMD(ev.date));
    setType(ev.type);
    peopleTags = (ev.people || []).slice();
    renderPeopleTags();
    overlay.classList.add('open');
  }

  function addHour(t){ let [h,m]=t.split(':').map(Number); h=(h+1)%24; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }

  function closeModal(){ overlay.classList.remove('open'); }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

  document.getElementById('fAllDay').addEventListener('change', (e)=>{
    document.getElementById('timeRow').style.display = e.target.checked ? 'none' : 'grid';
  });

  let currentType = 'evento';
  function setType(t){
    currentType = t;
    document.querySelectorAll('.type-opt').forEach(o=> o.classList.toggle('active', o.dataset.type===t));
  }
  document.querySelectorAll('.type-opt').forEach(o=> o.addEventListener('click', ()=> setType(o.dataset.type)));

  function renderPeopleTags(){
    const wrap = document.getElementById('peopleInput');
    wrap.querySelectorAll('.person-tag').forEach(t=>t.remove());
    const input = document.getElementById('fPersonField');
    peopleTags.forEach((p,idx)=>{
      const tag = document.createElement('div');
      tag.className = 'person-tag';
      tag.innerHTML = `<span class="p-av">${initials(p)}</span>${escapeHtml(p)}<button data-idx="${idx}">✕</button>`;
      tag.querySelector('button').addEventListener('click', ()=>{ peopleTags.splice(idx,1); renderPeopleTags(); });
      wrap.insertBefore(tag, input);
    });
  }
  document.getElementById('fPersonField').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && e.target.value.trim()){
      e.preventDefault();
      peopleTags.push(e.target.value.trim());
      e.target.value='';
      renderPeopleTags();
    } else if(e.key==='Backspace' && !e.target.value && peopleTags.length){
      peopleTags.pop(); renderPeopleTags();
    }
  });

  document.getElementById('btnSave').addEventListener('click', ()=>{
    const title = document.getElementById('fTitle').value.trim();
    if(!title){ toast('Dê um título ao compromisso'); document.getElementById('fTitle').focus(); return; }
    const date = document.getElementById('fDate').value;
    if(!date){ toast('Escolha uma data'); return; }
    const allDay = document.getElementById('fAllDay').checked;
    const status = document.getElementById('fStatus').value;

    if(editingEvent){
      editingEvent.title = title;
      editingEvent.type = currentType;
      editingEvent.date = date;
      editingEvent.allDay = allDay;
      editingEvent.start = allDay ? null : document.getElementById('fStart').value;
      editingEvent.end = allDay ? null : document.getElementById('fEnd').value;
      editingEvent.repeat = document.getElementById('fRepeat').value;
      editingEvent.people = peopleTags.slice();
      editingEvent.notes = document.getElementById('fNotes').value.trim();
      setStatus(editingEvent, editingOccDate || parseYMD(date), status);
      saveEvents();
      toast('Compromisso atualizado');
    } else {
      const ev = {
        id: uid(),
        title, type: currentType, date, allDay,
        start: allDay ? null : document.getElementById('fStart').value,
        end: allDay ? null : document.getElementById('fEnd').value,
        repeat: document.getElementById('fRepeat').value,
        people: peopleTags.slice(),
        notes: document.getElementById('fNotes').value.trim(),
        defaultStatus: status
      };
      events.push(ev);
      setStatus(ev, parseYMD(date), status);
      saveEvents();
      toast('Compromisso criado');
    }
    closeModal();
    renderAll();
  });

  document.getElementById('btnDelete').addEventListener('click', ()=>{
    if(!editingEvent) return;
    events = events.filter(e=>e.id !== editingEvent.id);
    Object.keys(occStatus).forEach(k=>{ if(k.startsWith(editingEvent.id+'__')) delete occStatus[k]; });
    saveEvents(); saveStatus();
    closeModal();
    renderAll();
    toast('Compromisso excluído');
  });

  document.getElementById('btnNewEvent').addEventListener('click', ()=> openNewModal(selectedDate));

  /* ---------------- Utils ---------------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- Master render ---------------- */
  function renderAll(){
    renderMiniCal();
    renderUpcoming();
    if(currentView==='month') renderMonth();
    else if(currentView==='week') renderWeek();
    else if(currentView==='kanban') renderKanban();
  }

  /* ---------------- Seed demo data (first run only) ---------------- */
  if(events.length === 0){
    const t = fmt(todayDate);
    const tmr = fmt(addDays(todayDate,1));
    const seed = [
      {id:uid(), title:'Reunião de alinhamento — obra Bela Vista', type:'reuniao', date:t, allDay:false, start:'09:30', end:'10:30', repeat:'weekly', people:['Marcos','Diego Navas'], notes:'Sala virtual — revisão do cronograma.', defaultStatus:'todo'},
      {id:uid(), title:'Editar roteiro do vídeo institucional', type:'tarefa', date:t, allDay:false, start:'11:00', end:'13:00', repeat:'none', people:['Marcos'], notes:'', defaultStatus:'doing'},
      {id:uid(), title:'Entrega do PDF para o cliente', type:'tarefa', date:t, allDay:true, start:null, end:null, repeat:'none', people:[], notes:'', defaultStatus:'done'},
      {id:uid(), title:'Gravação — Cube Vila Madalena', type:'evento', date:tmr, allDay:false, start:'14:00', end:'17:00', repeat:'none', people:['Marcos','Equipe de filmagem'], notes:'Levar drone e gimbal.', defaultStatus:'todo'},
      {id:uid(), title:'Check-in semanal', type:'reuniao', date:t, allDay:false, start:'17:00', end:'17:30', repeat:'weekly', people:['Time Sussa MGT'], notes:'', defaultStatus:'todo'},
    ];
    events = seed;
    saveEvents();
    seed.forEach(ev=> setStatus(ev, parseYMD(ev.date), ev.defaultStatus));
  }

  renderAll();
})();
</script>
</body>
</html>
